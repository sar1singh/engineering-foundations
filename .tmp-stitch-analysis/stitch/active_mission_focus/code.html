<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EngineeringOS - Active Mission Focus</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#FFFFFF",
          "background": "#0A0A0C",
          "surface": "#141519",
          "text": "#A1A1AA",
          "muted": "#27272A",
          "cyan": "#00E5FF",
          "purple": "#D8B4FE",
          "amber": "#FBBF24",
          "violet": "#818CF8",
        },
        fontFamily: {
          "heading": ["Space Grotesk", "sans-serif"],
          "body": ["Manrope", "sans-serif"],
        },
        borderRadius: {
          "DEFAULT": "4px",
          "lg": "4px",
          "xl": "4px",
          "full": "9999px",
        },
      },
    },
  }
</script>
<style>
  body {
    background-color: theme('colors.background');
    color: theme('colors.text');
    font-family: theme('fontFamily.body');
  }
  
  h1, h2, h3, h4, h5, h6 {
    font-family: theme('fontFamily.heading');
    color: theme('colors.primary');
  }
  
  .video-container:hover .custom-controls {
    opacity: 1;
  }
  
  .scratchpad:focus-within {
    border-color: theme('colors.cyan');
  }
</style>
</head>
<body class="min-h-screen overflow-hidden flex flex-col antialiased">
<!-- Focused View Minimal Header -->
<header class="h-16 bg-surface border-b border-muted flex items-center px-6 shrink-0">
<button class="flex items-center gap-2 text-text hover:text-primary transition-colors cursor-pointer group" onclick="history.back()">
<span class="material-symbols-outlined text-[20px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="font-heading font-semibold text-[14px]">Return to Mission Control</span>
</button>
</header>
<!-- Main Content Layout -->
<main class="flex-1 flex overflow-hidden">
<!-- Left Column: Video Content (70%) -->
<div class="flex-1 flex flex-col max-w-[70%] border-r border-muted bg-background relative overflow-y-auto">
<!-- Breadcrumbs & Context -->
<div class="p-6 pb-4 shrink-0">
<div class="flex items-center gap-2 text-[13px] font-medium text-text mb-2">
<span class="hover:text-primary cursor-pointer transition-colors">System Design</span>
<span class="text-muted">&gt;</span>
<span class="hover:text-primary cursor-pointer transition-colors">Distributed Caching</span>
<span class="text-muted">&gt;</span>
<span class="text-primary font-semibold">Eviction Policies</span>
</div>
<h1 class="text-[32px] font-bold leading-tight mt-1">LRU vs LFU: Strategic Discarding</h1>
</div>
<!-- Video Player Area -->
<div class="px-6 pb-6 flex-1 flex flex-col justify-center">
<div class="video-container relative aspect-video bg-black rounded overflow-hidden shadow-2xl border border-muted group w-full max-w-5xl mx-auto">
<!-- Placeholder Video Background -->
<div class="absolute inset-0 bg-surface flex items-center justify-center bg-cover bg-center" data-alt="A close up view of computer code on a dark monitor, glowing with cyan and green syntax highlighting, representing complex algorithmic structures. The lighting is low and moody, typical of a late-night coding session in a professional software engineering environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBv-Kv3rW65ZLFNeR5Oa73fs12maP-VSU1n-qt_YPJcJlgj7F7oskwYuJVIF7gBULRSYGVPPAvFmyh5in8Q7I7IuZTuHgp45Ctq21oJsRHF9JtNaNoBrBd6iw-0c-d6E43fNpp_oQ1_3WT5Xgj5PBC8BvyhYY-oXuRqYHiPHCYbibRZuXF3kEWce0H9iyNRFdUHQzYWygT2AkQcd6DzK3daliP-fkd3EA-ZoVopOUY4dyTjeeIgpWLCSqvnWK1b3214usO8wqYQbmc');">
<!-- Simulated Video Dark Overlay -->
<div class="absolute inset-0 bg-black/40"></div>
</div>
<!-- Custom Controls (Hover Activated) -->
<div class="custom-controls opacity-0 transition-opacity duration-300 absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/90 to-transparent flex flex-col gap-3">
<!-- Progress Bar -->
<div class="h-1 bg-muted rounded-full overflow-hidden cursor-pointer">
<div class="h-full bg-cyan w-[65%] relative">
<div class="absolute right-0 top-1/2 -translate-y-1/2 w-2 h-2 bg-primary rounded-full shadow-[0_0_8px_rgba(0,229,255,0.8)]"></div>
</div>
</div>
<!-- Control Buttons -->
<div class="flex items-center justify-between text-primary">
<div class="flex items-center gap-4">
<button class="hover:text-cyan transition-colors" id="playBtn">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="hover:text-cyan transition-colors">
<span class="material-symbols-outlined">volume_up</span>
</button>
<span class="text-[13px] font-medium font-body text-text">14:23 / 22:00</span>
</div>
<div class="flex items-center gap-4">
<button class="hover:text-cyan transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
<button class="hover:text-cyan transition-colors">
<span class="material-symbols-outlined">fullscreen</span>
</button>
</div>
</div>
</div>
<!-- Completion Overlay (Hidden by default, shown via JS for demonstration if needed) -->
<div class="hidden absolute inset-0 bg-black/80 flex flex-col items-center justify-center gap-6 backdrop-blur-sm z-20" id="completionOverlay">
<h2 class="text-2xl font-bold text-primary">Mission Accomplished</h2>
<p class="text-text max-w-md text-center">You've successfully mapped the eviction policy strategies. Ready to tackle consistent hashing?</p>
<button class="h-12 px-8 bg-primary text-background font-heading font-semibold text-[14px] rounded hover:bg-gray-200 transition-colors flex items-center gap-2">
              Proceed to Next Mission
              <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
<!-- Video Meta -->
<div class="mt-6 max-w-5xl mx-auto w-full flex items-center justify-between border-t border-muted pt-4">
<div class="flex gap-4">
<span class="px-2 py-1 bg-surface border border-muted rounded text-[12px] font-medium text-purple flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">architecture</span>
                    System Design
                </span>
<span class="px-2 py-1 bg-surface border border-muted rounded text-[12px] font-medium text-text">Medium Difficulty</span>
</div>
<button class="text-[13px] font-medium text-text hover:text-primary transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">flag</span> Report Issue
            </button>
</div>
</div>
</div>
<!-- Right Column: Context & Scratchpad (30%) -->
<div class="w-[30%] min-w-[320px] max-w-[480px] bg-surface flex flex-col border-l border-muted relative z-10">
<!-- Tabs (Visual only) -->
<div class="flex border-b border-muted">
<button class="flex-1 py-3 text-[13px] font-heading font-semibold text-primary border-b-2 border-primary">Scratchpad</button>
<button class="flex-1 py-3 text-[13px] font-heading font-semibold text-text hover:text-primary transition-colors">Transcript</button>
</div>
<!-- Scratchpad Area -->
<div class="flex-1 flex flex-col p-4">
<div class="flex items-center justify-between mb-2">
<span class="text-[12px] font-medium text-text flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-green-400">cloud_done</span>
                Auto-saved 2m ago
            </span>
<button class="text-text hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">content_copy</span>
</button>
</div>
<textarea class="flex-1 w-full bg-transparent border border-muted rounded p-4 text-[14px] text-text font-body leading-[1.6] focus:outline-none focus:ring-1 focus:ring-cyan focus:border-cyan resize-none transition-colors" id="scratchpadArea" placeholder="Jot down notes, architecture diagrams text, or pseudo-code here... Focus to auto-pause video.">LRU (Least Recently Used)
- Discards least recently used items first.
- Requires keeping track of what was used when (costly overhead if not optimized).
- Good for temporal locality.

LFU (Least Frequently Used)
- Discards least frequently used items first.
- Requires counter per item.
- Better for stable patterns, but can suffer from "cache pollution" if an item was heavily used in the past but is no longer relevant.</textarea>
</div>
</div>
</main>
<script>
    // Micro-interactions
    document.addEventListener('DOMContentLoaded', () => {
      const scratchpad = document.getElementById('scratchpadArea');
      const playBtn = document.getElementById('playBtn');
      const playIcon = playBtn.querySelector('.material-symbols-outlined');
      let isPlaying = true;

      // Auto-pause video when focusing scratchpad
      scratchpad.addEventListener('focus', () => {
        if (isPlaying) {
          playIcon.textContent = 'play_arrow';
          isPlaying = false;
          // In a real app, this would trigger video.pause()
          console.log('Video paused for note-taking');
        }
      });

      // Toggle play state
      playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      });
      
      // Simulate completing the video for demonstration purposes
      // setTimeout(() => {
      //   document.getElementById('completionOverlay').classList.remove('hidden');
      // }, 5000);
    });
  </script>
</body></html>
