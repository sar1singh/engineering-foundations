<style>
  body {
    background-color: theme('colors.canvas-bg');
    color: theme('colors.text-main');
    font-family: theme('fontFamily.display');
    margin: 0;
    overflow: hidden; /* Prevent native scroll, we will simulate canvas drag */
  }

  .canvas-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    cursor: grab;
  }
  
  .canvas-container:active {
    cursor: grabbing;
  }

  .canvas-content {
    position: absolute;
    top: 0;
    left: 0;
    width: 4000px; /* Arbitrary large width for demo */
    height: 2000px;
    background-image: theme('backgroundImage.grid-pattern');
    background-size: theme('backgroundSize.grid-20');
    transform-origin: 0 0;
    transition: transform 0.1s ease-out; /* Smooth pan/zoom */
  }

  .stage-divider {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    border-left: 2px dashed theme('colors.text-muted');
    z-index: 0;
  }

  .stage-label {
    position: absolute;
    top: 40px;
    left: 20px;
    color: theme('colors.text-muted');
    font-size: 24px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .node {
    position: absolute;
    width: 160px;
    height: 64px;
    background-color: theme('colors.surface');
    border-radius: theme('borderRadius.sm');
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    box-sizing: border-box;
    z-index: 10;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }

  .node-label {
    font-family: theme('fontFamily.display');
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    line-height: 1.2;
    pointer-events: none; /* Let the node handle hover */
  }

  /* Node States */
  .node.unlocked {
    border: 1px solid theme('colors.domain-sys'); /* Default, overridden via inline styles or specific classes */
    border-left-width: 4px;
  }

  .node.unlocked:hover {
    transform: scale(1.05);
    box-shadow: 0 0 12px var(--glow-color, theme('colors.primary'));
    z-index: 20;
  }

  .node.locked {
    opacity: 0.4;
    border: 1px dashed theme('colors.text-muted');
    border-left-width: 4px;
    border-left-style: solid;
    border-left-color: theme('colors.text-muted');
  }

  .node.locked:hover {
     transform: scale(1.02);
  }

  .node.mastered {
    border: 1px solid theme('colors.status-done');
    border-left-width: 4px;
    border-left-color: theme('colors.status-done');
  }

  /* Connection Lines */
  .edge {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  
  path.connection {
    fill: none;
    stroke: theme('colors.text-muted');
    stroke-width: 2px;
  }

  path.connection.active {
    stroke: theme('colors.status-done');
    filter: drop-shadow(0 0 4px theme('colors.status-done'));
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%);
    background-color: theme('colors.surface');
    border: 1px solid theme('colors.grid-line');
    padding: 8px 12px;
    border-radius: theme('borderRadius.sm');
    font-family: theme('fontFamily.mono');
    font-size: 12px;
    color: theme('colors.text-main');
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 30;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  }

  .node:hover .tooltip {
    opacity: 1;
  }

  /* Floating UI Panels */
  .floating-panel {
    position: fixed;
    background-color: rgba(18, 30, 61, 0.8);
    backdrop-filter: blur(8px);
    border: 1px solid theme('colors.grid-line');
    border-radius: theme('borderRadius.sm');
    z-index: 100;
  }

  /* Loading Overlay */
  .scanline {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 10px;
    background: linear-gradient(to bottom, transparent, theme('colors.primary'), transparent);
    opacity: 0.5;
    animation: scan 3s linear infinite;
    pointer-events: none;
    z-index: 999;
    display: none; /* Hidden by default */
  }

  @keyframes scan {
    0% { transform: translateY(-100vh); }
    100% { transform: translateY(200vh); }
  }

  /* Shared TopAppBar overrides for this specific view */
  .top-nav-shared {
     background-color: transparent !important;
     position: fixed;
     top: 0;
     width: 100%;
     z-index: 1000;
     pointer-events: none; /* Let clicks pass through to canvas mostly */
  }
  .top-nav-shared header {
      background-color: theme('colors.background-dark');
      pointer-events: auto;
  }
</style>

<script>
    // Simple Pan and Zoom Logic
    const container = document.getElementById('canvas-container');
    const content = document.getElementById('canvas-content');
    
    let isDragging = false;
    let startX, startY;
    let translateX = 0;
    let translateY = 0;
    let scale = 1;

    function updateTransform() {
        content.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    container.addEventListener('mousedown', (e) => {
        // Don't drag if clicking a node
        if (e.target.closest('.node')) return;
        
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    // Wheel to pan (or zoom if ctrl is held)
    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.ctrlKey) {
            // Zoom
            const zoomAmount = e.deltaY > 0 ? -0.1 : 0.1;
            zoom(zoomAmount, e.clientX, e.clientY);
        } else {
            // Pan
            translateX -= e.deltaX;
            translateY -= e.deltaY;
            updateTransform();
        }
    }, { passive: false });

    function zoom(amount, mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2) {
        const newScale = Math.min(Math.max(0.3, scale + amount), 2);
        
        // Adjust translation to zoom towards mouse/center
        if (newScale !== scale) {
            const scaleRatio = newScale / scale;
            translateX = mouseX - (mouseX - translateX) * scaleRatio;
            translateY = mouseY - (mouseY - translateY) * scaleRatio;
            scale = newScale;
            updateTransform();
        }
    }

    function resetView() {
        scale = 1;
        translateX = 0;
        translateY = 0;
        updateTransform();
    }

    // Initial centerish position
    translateX = 50;
    translateY = 50;
    updateTransform();

</script>
